<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crypto Snake</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'crypto-dark': '#1a1a1a',
              'crypto-darker': '#121212',
              'crypto-green': '#00c853',
              'crypto-border': '#333333',
            },
            boxShadow: {
                'crypto-green-glow': '0 0 15px rgba(0, 200, 83, 0.5)',
            },
            animation: {
                fadeIn: 'fadeIn 0.5s ease-in-out',
            },
            keyframes: {
                fadeIn: {
                    '0%': { opacity: '0' },
                    '100%': { opacity: '1' },
                },
            }
          },
        },
      }
    </script>
